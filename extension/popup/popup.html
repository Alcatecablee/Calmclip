<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CalmClip</title>
  <style>
    /* -- Design tokens (mirrored from index.css) -- */
    :root {
      --primary:         hsl(340, 82%, 58%);
      --primary-a15:     hsl(340 82% 58% / 0.15);
      --primary-a40:     hsl(340 82% 58% / 0.40);
      --bg-page:         hsl(240, 6%, 7%);
      --bg-surface:      hsl(240, 5%, 10%);
      --bg-surface-2:    hsl(240, 4%, 13%);
      --text-primary:    hsl(0, 0%, 95%);
      --text-muted:      hsl(240, 4%, 55%);
      --text-dim:        hsl(240, 4%, 44%);
      --border-subtle:   rgba(255, 255, 255, 0.06);
      --secondary:       hsl(240, 4%, 16%);
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }
    p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
    }
    button {
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }

    /* -- Idle state -- */
    #record-btn {
      background-color: var(--primary);
    }
    #record-btn:hover {
      background-color: hsl(340, 82%, 64%);
    }

    /* -- Recording state -- */
    #recording-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rec-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rec-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-a15);
      border: 1px solid var(--primary-a40);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .rec-dot {
      width: 7px;
      height: 7px;
      background-color: var(--primary);
      border-radius: 50%;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }

    .timer {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--text-primary);
      margin: 4px 0;
    }

    .timer-label {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin-top: -4px;
    }

    /* Recording activity bar */
    .rec-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--primary);
      animation: bar-pulse 1.5s ease-in-out infinite;
    }
    @keyframes bar-pulse {
      0%   { opacity: 0.3; }
      50%  { opacity: 1; }
      100% { opacity: 0.3; }
    }

    #stop-btn {
      background-color: var(--secondary);
    }
    #stop-btn:hover {
      background-color: var(--bg-surface-2);
    }

    .tip {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-surface);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }
    .tip strong {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="23 7 16 12 23 17 23 7"></polygon>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
    </svg>
    CalmClip
  </h1>

  <!-- Idle state -->
  <div id="idle-panel">
    <p id="status-text">Record the current tab directly into the local editor.</p>

    <button id="record-btn" style="margin-top: 4px;">
      <div style="width:8px;height:8px;border-radius:50%;background:white;"></div>
      Record This Tab
    </button>

    <div class="tip" id="tip-text">
      <strong>Tip:</strong> The tab is captured at its exact current size. Maximize the video player for the best quality!
    </div>
  </div>

  <!-- Recording state -->
  <div id="recording-panel" class="hidden">
    <div class="rec-header">
      <div class="rec-badge"><div class="rec-dot"></div> REC</div>
    </div>

    <div class="timer" id="timer">00:00</div>
    <div class="timer-label">Recording this tab. Switch back and let the video play.</div>

    <div class="rec-bar"></div>

    <button id="stop-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
      Stop &amp; Edit
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
