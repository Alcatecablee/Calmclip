<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You are offline | CalmClip</title>
  <meta name="theme-color" content="#363640" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f11;
      color: #ffffff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 0;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      color: #a1a1aa;
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: #03a9f4;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #515159;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="CalmClip" class="icon" />
  <h1>You are offline</h1>
  <p>CalmClip is a local video editor that runs entirely in your browser. Once you reconnect, everything will pick up exactly where you left off. Your files never leave your device either way.</p>
  <button onclick="location.reload()">Try again</button>
  <p class="note">No data is ever sent to a server. Your edits are safe on your device.</p>
</body>
</html>
